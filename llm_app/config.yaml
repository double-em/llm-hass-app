name: "OmniVoice TTS"
description: "Custom voice cloning and TTS for Home Assistant using OmniVoice"
version: "0.1.0"
slug: "omnivoice_tts"
init: false
arch:
  - aarch64
  - amd64
startup: services
ports:
  8000/tcp: 8000
options:
  model: "k2-fsa/OmniVoice"
  device: "auto"
  default_speed: 1.0
  default_steps: 32
schema:
  model: str
  device: str
  default_speed: num
  default_steps: int
